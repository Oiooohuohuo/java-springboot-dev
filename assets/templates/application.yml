server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: {{artifactId}}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境改为 ${DB_URL} 环境变量注入,不要硬编码密码
    url: jdbc:mysql://localhost:3306/school?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  # Flyway:启动时自动把脚本应用到数据库
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 库非空(已有其它业务表)时,baseline-on-migrate 与 baseline-version 必须成对出现
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: 初始化空版本基线
    # 禁止 clean,避免误删库中其它表
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除:删除操作转为 update deleted = 1
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.hgschool: debug
